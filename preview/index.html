function renderObjects(){return header('Реестр объектов','Действующие и запускаемые объекты аутсорсинга.','Операции','Объекты')+metrics([{label:'Объекты',value:'14',note:'активных'},{label:'На запуске',value:'3',note:'в подготовке'},{label:'Персонал',value:'328',note:'назначено'},{label:'Риски',value:'2',note:'требуют внимания',tone:'tone-warn'}])+genericTable(['Объект','Клиент','Регион','Персонал','Готовность','Статус'],[['Руднево · к9','ООО «ДАСКАР»','Москва','18 / 20','90%','Активен'],['Воротынск','AQUATON','Калужская обл.','27 / 31','87%','Комплектация'],['Контакт-центр','Цифровой сервис','Удалённо','54 / 60','90%','Запуск']]);}
function renderWorkers(){return header('Сотрудники','Единый реестр работников и их назначений.','Люди','Персонал')+metrics([{label:'Сотрудники',value:'512',note:'в базе'},{label:'На объектах',value:'328',note:'активных'},{label:'Готовы к выходу',value:'47',note:'прошли подготовку'},{label:'Проблемы документов',value:'9',note:'требуют внимания',tone:'tone-warn'}])+genericTable(['Сотрудник','Специальность','Статус','Объект','Готовность','Активность'],[['Иванов Алексей','Комплектовщик','Работает','Руднево','100%','Сегодня'],['Смирнов Павел','Грузчик','Готов к выходу','Воротынск','92%','Сегодня'],['Петрова Анна','Оператор КЦ','Оформление','Контакт-центр','78%','Вчера']]);}
function tenderDays(d){const x=Math.ceil((new Date(d)-Date.now())/86400000);return x<0?`Просрочено ${Math.abs(x)} дн.`:x===0?'Сегодня':`${x} дн.`}
function renderTenders(){const q=search.trim().toLowerCase();const rows=tenders.filter(t=>!q||[t.title,t.customer,t.platform,t.number].join(' ').toLowerCase().includes(q));const newCount=tenders.filter(t=>t.stage==='Новый').length,analysis=tenders.filter(t=>['Анализ','Расчёт','Согласование'].includes(t.stage)).length,participate=tenders.filter(t=>t.decision==='Участвуем').length,urgent=tenders.filter(t=>{const d=Math.ceil((new Date(t.deadline)-Date.now())/86400000);return d>=0&&d<=3}).length;let body=header('Тендеры','Параллельный коммерческий процесс: импорт, анализ, расчёт, документы, согласование и подача.','Коммерция','Продажи')+metrics([{label:'Новые',value:newCount,note:'требуют первичного разбора'},{label:'На анализе',value:analysis,note:'изучаем условия'},{label:'Участвуем',value:participate,note:'решение принято'},{label:'Срок ≤ 3 дней',value:urgent,note:'требуют внимания',tone:urgent?'tone-warn':''}])+`<div class="preview-note"><strong>Preview из основного репозитория.</strong> Используются настоящие базовые стили OPERIS и навигационная структура. Данные здесь демонстрационные и хранятся только в браузере.</div><div class="preview-toolbar"><div class="segmented"><button class="${tenderView==='list'?'active':''}" onclick="setTenderView('list')">Список</button><button class="${tenderView==='board'?'active':''}" onclick="setTenderView('board')">Доска</button></div><input placeholder="Поиск по тендерам" value="${search}" oninput="search=this.value;render()"><div class="preview-spacer"></div><button class="button" onclick="exportTenders()">Выгрузить Excel</button><button class="button" onclick="document.getElementById('excelInput').click()">Загрузить Excel</button><button class="button primary" onclick="openDrawer()">+ Добавить тендер</button></div>`;if(tenderView==='board'){const stages=['Новый','Анализ','Расчёт','Согласование','Подготовка','Подано'];body+=`<div class="preview-board">${stages.map(s=>`<section class="preview-column"><header><strong>${s}</strong><span>${rows.filter(t=>t.stage===s).length}</span></header><div class="preview-stack">${rows.filter(t=>t.stage===s).map(t=>`<div class="preview-tender-card" onclick="go('/tenders/${t.id}')"><strong>${t.title}</strong><small>${t.customer}</small><small>${t.platform} · ${t.number}</small><small class="${tenderDays(t.deadline).includes('Просрочено')?'preview-danger':''}">${tenderDays(t.deadline)} · ${t.owner}</small></div>`).join('')||'<div class="cell-sub">Нет тендеров</div>'}</div></section>`).join('')}</div>`}else{body+=`<div class="preview-generic-table"><table class="data-table"><thead><tr><th>Тендер</th><th>Заказчик</th><th>Подача до</th><th>Осталось</th><th>Коммерция</th><th>Этап</th><th>Ответственный</th></tr></thead><tbody>${rows.map(t=>`<tr class="preview-link" onclick="go('/tenders/${t.id}')"><td><span class="cell-title">${t.title}</span><span class="cell-sub">${t.platform} · ${t.number}</span></td><td>${t.customer}<span class="cell-sub">${t.roles}</span></td><td class="preview-due">${new Date(t.deadline).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td><span class="status ${tenderDays(t.deadline).includes('Просрочено')?'status-bad':'status-neutral'}"><i></i>${tenderDays(t.deadline)}</span></td><td>${t.price?money(t.price):'Цена не указана'}<span class="cell-sub">${t.potential} потенциал · ${t.calc}</span></td><td><span class="status status-neutral"><i></i>${t.stage}</span><span class="cell-sub">${t.decision}</span></td><td>${t.owner}</td></tr>`).join('')}</tbody></table></div>`}return body}
function detailTabs(id,active){return `<div class="entity-tabs">${['Обзор','Анализ','Документы','Расчёты','Согласования','Подача','История'].map(tab=>`<a class="${active===tab?'active':''}" href="#/tenders/${id}?tab=${encodeURIComponent(tab)}">${tab}</a>`).join('')}</div>`}
function renderTenderDetail(id){const t=tenders.find(x=>x.id===id)||tenders[0];const params=new URLSearchParams(currentRoute().split('?')[1]||'');const tab=params.get('tab')||'Обзор';let body=header(t.title,`${t.customer} · ${t.platform} · ${t.number}`,'Коммерция','Тендеры')+detailTabs(t.id,tab)+`<div class="summary-strip"><strong>${t.stage}</strong><span>Подача до: ${new Date(t.deadline).toLocaleString('ru-RU')}</span><span>Решение: ${t.decision}</span><span>Ответственный: ${t.owner}</span><span>${t.price?money(t.price):'НМЦК не указана'}</span></div>`;if(tab==='Обзор')body+=`<div class="preview-detail-grid"><div><section class="section"><div class="section-head"><div><h2>Ключевые условия</h2><p>Сводка для быстрого решения по тендеру</p></div></div><div style="padding:14px" class="preview-facts"><div class="preview-fact"><span>Площадка</span><strong>${t.platform}</strong></div><div class="preview-fact"><span>Потенциал</span><strong>${t.potential}</strong></div><div class="preview-fact"><span>Позиции</span><strong>${t.roles}</strong></div><div class="preview-fact"><span>Расчёты</span><strong>${t.calc}</strong></div><div class="preview-fact"><span>Формат цены</span><strong>чел./час</strong></div><div class="preview-fact"><span>Регион</span><strong>Уточняется</strong></div></div></section><section class="section"><div class="section-head"><h2>Заключение аналитика</h2></div><div style="padding:14px;color:var(--muted);line-height:1.6">${t.summary}</div></section></div><aside><section class="section"><div class="section-head"><h2>Рабочий контекст</h2></div><div style="padding:0 14px"><div class="key-value"><span>Этап</span><strong>${t.stage}</strong></div><div class="key-value"><span>Решение</span><strong>${t.decision}</strong></div><div class="key-value"><span>Подача</span><strong>${tenderDays(t.deadline)}</strong></div><div class="key-value"><span>Ответственный</span><strong>${t.owner}</strong></div></div></section></aside></div>`;else if(tab==='Анализ')body+=`<section class="section"><div class="section-head"><div><h2>Анализ тендера</h2><p>Структурированные условия и вывод аналитика</p></div><button class="button">Редактировать</button></div><div style="padding:14px" class="preview-facts">${[['Предмет закупки',t.roles],['Формат оплаты','чел./час'],['Гарантированный объём','Требует проверки'],['График','По заявкам заказчика'],['Проживание','Уточняется'],['Транспорт','Уточняется'],['НДС','С НДС'],['Обеспечение заявки','Требует проверки'],['Опыт аналогичных контрактов','Проверить документы компании']].map(x=>`<div class="preview-fact"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div style="padding:0 14px 14px"><h3>Вопросы и риски</h3><p style="color:var(--muted);line-height:1.6">${t.questions||'Критичных вопросов пока не зафиксировано.'}</p><h3>Комментарий аналитика</h3><p style="color:var(--muted);line-height:1.6">${t.summary}</p></div></section>`;else if(tab==='Документы')body+=`<div class="preview-detail-grid"><section class="section"><div class="section-head"><div><h2>Документы тендера</h2><p>Исходная документация заказчика</p></div><button class="button">+ Документ</button></div><div style="padding:12px" class="preview-docs">${['Техническое задание.pdf','Проект договора.docx','Спецификация.xlsx','Форма ценового предложения.xlsx'].map(x=>`<div class="preview-doc"><strong>${x}</strong><span>Открыть</span></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Документы компании</h2></div><div style="padding:12px" class="preview-docs">${[['Устав','Готов'],['Выписка ЕГРЮЛ','Готов'],['Справка ФНС','Нужно обновить'],['Аналогичный договор','Проверить']].map(x=>`<div class="preview-doc"><strong>☐ ${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></section></div>`;else if(tab==='Расчёты')body+=genericTable(['Сценарий','Позиция','Ставка без НДС','С НДС','Маржа','Статус'],[['Базовый','Комплектовщик','650 ₽/ч','793 ₽/ч','18,4%','Согласован'],['Минимальный','Комплектовщик','620 ₽/ч','756 ₽/ч','14,6%','Черновик']])+`<div style="margin-top:12px"><button class="button primary" onclick="go('/calculations')">Открыть калькулятор</button></div>`;else if(tab==='Согласования')body+=genericTable(['Тип','Инициатор','Согласующий','Статус','Дата'],[['Участие','Сергей','Руководитель направления','Согласовано','08.09.2026'],['Цена','Сергей','Коммерческий директор','На согласовании','09.09.2026'],['Разрешение подачи','Анна','Руководитель направления','Ожидает','—']]);else if(tab==='Подача')body+=`<section class="section"><div class="section-head"><div><h2>Готовность к подаче</h2><p>Комплект документов и финальная проверка</p></div><strong>7 / 9</strong></div><div style="padding:12px" class="preview-docs">${[['Цена рассчитана','Готово'],['Решение об участии','Готово'],['Карточка компании','Готово'],['Доверенность','Готово'],['Справка ФНС','Нужно обновить'],['Обеспечение заявки','В работе'],['Финальная форма','Готово']].map(x=>`<div class="preview-doc"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></section>`;else body+=genericTable(['Дата','Событие','Пользователь'],[['09.09.2026 12:10','Расчёт передан на согласование','Сергей'],['09.09.2026 10:25','Обновлено аналитическое заключение','Сергей'],['08.09.2026 17:40','Добавлены документы компании','Анна'],['08.09.2026 09:15','Тендер зарегистрирован','Сергей']]);return body}
function renderGeneric(route){const meta=titles[route]||{title:'Раздел OPERIS',section:'OPERIS',group:'Модуль'};return header(meta.title,`Визуальное состояние раздела «${meta.title}» в общей архитектуре OPERIS.`,meta.section,meta.group)+`<div class="preview-foundation"><div><strong>${meta.title}</strong><div>Этот раздел доступен в навигации preview. Для него здесь показан общий production shell, тема и навигация; бизнес-данные не подключаются к GitHub Pages.</div><div style="margin-top:14px"><button class="button" onclick="go('/tenders')">Открыть Тендеры</button></div></div></div>`}
function render(){renderNav();const route=currentRoute();const path=route.split('?')[0];let html;if(path==='/tenders')html=renderTenders();else if(path.startsWith('/tenders/'))html=renderTenderDetail(path.split('/')[2]);else if(path==='/requests')html=renderRequests();else if(path==='/clients')html=renderClients();else if(path==='/proposals')html=renderProposals();else if(path==='/calculations')html=renderCalculations();else if(path==='/objects')html=renderObjects();else if(path==='/workers')html=renderWorkers();else html=renderGeneric(path);document.getElementById('page').innerHTML=html;const meta=titles[path]||{title:path.startsWith('/tenders/')?'Тендер':'OPERIS'};document.getElementById('topContext').textContent=`Рабочий контур · ${meta.title}`;window.scrollTo(0,0)}
function money(n){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n)}
function setTenderView(v){tenderView=v;render()}
function openDrawer(){document.getElementById('drawer').classList.add('is-open');setTimeout(()=>document.getElementById('newTitle').focus(),50)}
function closeDrawer(){document.getElementById('drawer').classList.remove('is-open')}
function saveTender(){const title=document.getElementById('newTitle').value.trim();if(!title)return alert('Укажите название тендера');tenders.unshift({id:'local-'+Date.now(),title,customer:document.getElementById('newCustomer').value||'Заказчик не указан',platform:document.getElementById('newPlatform').value||'Площадка не указана',number:document.getElementById('newNumber').value||'—',deadline:document.getElementById('newDeadline').value||new Date(Date.now()+7*86400000).toISOString(),price:Number(document.getElementById('newPrice').value)||0,stage:'Новый',decision:'Не принято',potential:document.getElementById('newPotential').value,owner:'Сергей',roles:'Не определены',calc:'Нет',summary:document.getElementById('newComment').value||'Требуется первичный анализ.',questions:''});localStorage.setItem('operis.preview.tenders',JSON.stringify(tenders));closeDrawer();render()}
function exportTenders(){const rows=[['Название','Заказчик','Площадка','Номер','Подача до','НМЦК','Этап','Решение'],...tenders.map(t=>[t.title,t.customer,t.platform,t.number,t.deadline,t.price,t.stage,t.decision])];if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Тендеры');XLSX.writeFile(wb,'OPERIS_тендеры_preview.xlsx')}else{const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='OPERIS_тендеры_preview.csv';a.click()}}
function importExcel(file){if(!file)return;if(!window.XLSX)return alert('Библиотека Excel ещё загружается. Повторите через несколько секунд.');const reader=new FileReader();reader.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});let count=0;rows.forEach((r,i)=>{const title=r['Название']||r['Название тендера']||r['Тендер']||r['Наименование'];if(!title)return;tenders.push({id:'imp-'+Date.now()+'-'+i,title:String(title),customer:String(r['Заказчик']||r['Компания']||'Заказчик не указан'),platform:String(r['Площадка']||r['ЭТП']||''),number:String(r['Номер торга']||r['Номер закупки']||r['Номер']||'—'),deadline:r['Срок']||r['Подача до']||new Date(Date.now()+7*86400000).toISOString(),price:Number(r['Цена в ₽']||r['НМЦК']||r['Цена']||0),stage:'Новый',decision:'Не принято',potential:'Средний',owner:'Не назначен',roles:'Не определены',calc:'Нет',summary:String(r['Комментарий']||'Импортировано из Excel.'),questions:''});count++});localStorage.setItem('operis.preview.tenders',JSON.stringify(tenders));render();alert(`Импортировано тендеров: ${count}`)};reader.readAsArrayBuffer(file)}
document.getElementById('excelInput').addEventListener('change',e=>importExcel(e.target.files?.[0]));document.getElementById('themeToggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('operis.preview.theme',next)});const savedTheme=localStorage.getItem('operis.preview.theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;document.getElementById('collapse').addEventListener('click',()=>{const s=document.getElementById('sidebar'),t=document.getElementById('topbar');s.classList.toggle('sidebar-compact');t.classList.toggle('topbar-compact');document.getElementById('collapse').textContent=s.classList.contains('sidebar-compact')?'▶':'◀'});document.getElementById('drawer').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeDrawer()});window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const q=prompt('Быстрый переход: введите название раздела');if(q){const x=Object.entries(titles).find(([,m])=>m.title.toLowerCase().includes(q.toLowerCase()));if(x)go(x[0])}}});render();
</script>
</body>
</html>
