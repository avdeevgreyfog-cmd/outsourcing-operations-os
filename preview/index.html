<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OPERIS · Visual Preview</title>
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="request-workflow.css" />
  <link rel="stylesheet" href="request-polish.css" />
  <link rel="stylesheet" href="request-baseline.css" />
  <link rel="stylesheet" href="request-final.css" />
  <link rel="stylesheet" href="request-entity.css" />
  <link rel="stylesheet" href="commercial-baseline.css" />
  <link rel="stylesheet" href="proposal-template.css" />
  <link rel="stylesheet" href="tender-core.css" />
  <link rel="stylesheet" href="tender-demo.css" />
  <link rel="stylesheet" href="tender-final.css" />
  <link rel="stylesheet" href="preview.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">O</span><div><strong>OPERIS</strong><small>Операционная система</small></div></div>
      <button class="nav-search" id="quickSearch" type="button" title="Быстрый переход"><span class="preview-nav-icon">⌕</span><span>Быстрый переход</span><kbd>Ctrl K</kbd></button>
      <nav class="nav-groups" id="nav" aria-label="Основная навигация"></nav>
      <div class="sidebar-foot"><div class="avatar">СА</div><div class="who"><strong>Сергей Авдеев</strong><span>Администратор · preview</span></div><button type="button" class="sidebar-collapse" id="collapse" title="Свернуть меню">◀</button></div>
    </aside>
    <header class="topbar" id="topbar">
      <div class="topbar-context"><span class="live-dot"></span><span id="topContext">Рабочий контур · Администратор</span></div>
      <div class="topbar-actions"><select class="preview-role-select" aria-label="Роль"><option>Администратор</option><option>Менеджер продаж</option><option>Менеджер объекта</option><option>Региональный менеджер</option></select><button class="icon-button theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему"><svg class="theme-light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg><svg class="theme-dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button><button class="icon-button" type="button" onclick="go('/tasks')" title="Задачи">✓</button></div>
    </header>
    <main class="main-canvas"><div class="page-wrap" id="page"></div></main>
  </div>

  <div class="preview-modal" id="drawer"><aside class="preview-drawer"><div class="preview-drawer-head"><div><strong>Добавить тендер</strong><span>Регистрация новой закупки в Tender Core</span></div><button class="icon-button" type="button" onclick="closeDrawer()">×</button></div><div class="preview-drawer-body"><div class="preview-form"><label class="wide"><span>Название тендера *</span><input id="newTitle" /></label><label><span>Заказчик</span><input id="newCustomer" /></label><label><span>Площадка</span><input id="newPlatform" placeholder="ЕИС, B2B-Center, Bidzaar…" /></label><label><span>Номер процедуры</span><input id="newNumber" /></label><label><span>НМЦК, ₽</span><input id="newPrice" type="number" /></label><label><span>Подача до</span><input id="newDeadline" type="datetime-local" /></label><label><span>Потенциал</span><select id="newPotential"><option>Средний</option><option>Высокий</option><option>Низкий</option></select></label><label class="wide"><span>Комментарий аналитика</span><textarea id="newComment" rows="5"></textarea></label></div></div><div class="preview-drawer-foot"><button class="button" type="button" onclick="closeDrawer()">Отмена</button><button class="button primary" type="button" onclick="saveTender()">Добавить тендер</button></div></aside></div>
  <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" hidden />
  <script src="app.js"></script>
</body>
</html>
