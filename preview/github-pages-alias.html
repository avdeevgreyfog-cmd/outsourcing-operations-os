<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>OPERIS</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#1f252b}
    body{display:grid;place-items:center}
    main{max-width:520px;padding:28px;text-align:center}
    h1{margin:0 0 8px;font-size:20px}
    p{margin:0 0 18px;color:#6f7780;font-size:14px;line-height:1.5}
    a{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border:1px solid #d7d9dc;border-radius:7px;color:#1f252b;text-decoration:none;background:#fff;font-size:13px;font-weight:600}
  </style>
  <script>
    (() => {
      const productionOrigin = "https://outsourcing-operations-os-g942.vercel.app";
      const pagesBase = "/outsourcing-operations-os";
      let path = window.location.pathname || "/";
      if (path === pagesBase) path = "/";
      else if (path.startsWith(pagesBase + "/")) path = path.slice(pagesBase.length);
      const target = productionOrigin + (path || "/") + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <h1>OPERIS</h1>
    <p>Открываем актуальную production-версию системы.</p>
    <a href="https://outsourcing-operations-os-g942.vercel.app/">Открыть OPERIS</a>
  </main>
</body>
</html>
