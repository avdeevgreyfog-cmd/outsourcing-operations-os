name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  issues:
    types: [opened]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      SESSION_SECRET: "ci-only-not-used-outside-demo-mode"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Pack deployable source
        run: tar --exclude='./node_modules' --exclude='./.git' --exclude='./.next' -czf /tmp/operations-os-source.tgz .
      - name: Upload deployable source
        uses: actions/upload-artifact@v4
        with:
          name: operations-os-source
          path: /tmp/operations-os-source.tgz
          retention-days: 1

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: operations_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/operations_os_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run db:setup
      - run: npm run test:db
