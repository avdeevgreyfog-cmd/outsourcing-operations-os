name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  issues:
    types: [opened]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      SESSION_SECRET: "ci-only-not-used-outside-demo-mode"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Pack deployable source
        run: tar --exclude='./node_modules' --exclude='./.git' --exclude='./.next' -czf /tmp/operations-os-source.tgz .
      - name: Upload deployable source
        uses: actions/upload-artifact@v4
        with:
          name: operations-os-source
          path: /tmp/operations-os-source.tgz
          retention-days: 1
