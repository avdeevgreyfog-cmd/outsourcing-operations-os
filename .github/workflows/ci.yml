name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  issues:
    types: [opened]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      SESSION_SECRET: "ci-only-not-used-outside-demo-mode"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Pack deployable source
        run: tar --exclude='./node_modules' --exclude='./.git' --exclude='./.next' -czf /tmp/operations-os-source.tgz .
      - name: Upload deployable source
        uses: actions/upload-artifact@v4
        with:
          name: operations-os-source
          path: /tmp/operations-os-source.tgz
          retention-days: 1

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: operations_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/operations_os_test
      DEMO_MODE: "true"
      SESSION_SECRET: "ci-postgres-workspace-smoke"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run db:setup
      - run: npm run test:db
      - name: Build database-backed app
        run: npm run build
      - name: Verify real tenant object rendering
        shell: bash
        run: |
          set -euo pipefail
          export CI_SMOKE_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          node scripts/prepare-ci-workspace-smoke.mjs
          npm start -- --hostname 127.0.0.1 --port 3100 >/tmp/operis-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            code="$(curl -sS -o /tmp/ci-status.json -w '%{http_code}' http://127.0.0.1:3100/api/system/status || true)"
            if [ "$code" = "200" ]; then break; fi
            if [ "$attempt" = "40" ]; then cat /tmp/operis-ci-server.log; exit 1; fi
            sleep 1
          done
          CI_SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/verify-ci-workspace-smoke.mjs


  pages-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES_DEMO: "1"
      NEXT_PUBLIC_GITHUB_PAGES_DEMO: "1"
      NEXT_PUBLIC_BASE_PATH: "/outsourcing-operations-os"
      DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Prepare static demo source
        run: |
          node scripts/prepare-pages-demo.mjs
          rm -rf app/api
          rm -rf app/login app/activate
          rm -rf app/request-form app/request-intake
      - name: Build GitHub Pages demo from the real app
        run: npm run build
      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/recruiting/index.html
          test -f out/candidates/index.html
          test -f out/objects/index.html
          test -f out/objects/80000000-0000-4000-8000-000000000001/index.html
          test -f out/workers/88000000-0000-4000-8000-000000000001/index.html
