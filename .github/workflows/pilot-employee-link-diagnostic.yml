name: Personal Employee Link Diagnostic
on:
  push:
    branches: [pilot/sergey-work]
    paths:
      - "app/api/system/status/route.ts"
      - ".github/workflows/pilot-employee-link-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-personal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live personal runtime readiness without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            code="$(curl --max-time 12 -sS -o /tmp/pilot-status.json -w '%{http_code}' "https://operis-workspace.vercel.app/api/system/status" || true)"
            if [ "$code" = "200" ]; then
              if node - <<'NODE'
          const status=require('/tmp/pilot-status.json');
          console.log(JSON.stringify({deployedSha:status.deploymentSha,schemaVersion:status.schemaVersion,dbAvailable:status.databaseConfigured,cryptoAvailable:status.employeeLinkEncryptionConfigured,employeePortalRelease:status.employeePortalRelease}));
          if(status.ok!==true||status.schemaVersion!=='0082_employee_portal_legacy_expiration.sql'||status.employeePortalRelease!=='v2.2-live-20261020'||status.databaseConfigured!==true||!status.databaseIdentity||status.environment!=='personal-pilot'||typeof status.demoAvailable!=='boolean')process.exit(1);
          if(!status.deploymentSha)process.exit(1);
          require('fs').writeFileSync('/tmp/pilot-deployed-sha',status.deploymentSha);
          if(status.employeeLinkEncryptionConfigured!==true)process.exit(2);
          NODE
              then
                deployed_sha="$(cat /tmp/pilot-deployed-sha)"
                if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
                  echo "Live runtime serves the current commit."; exit 0
                fi
                if [[ ! "$deployed_sha" =~ ^[[:xdigit:]]{40}$ ]] || ! git cat-file -e "$deployed_sha^{commit}" 2>/dev/null; then
                  echo "Unexpected live commit SHA; awaiting deployment."
                elif [ -z "$(git diff --name-only "$deployed_sha" "$GITHUB_SHA" -- . ':(exclude).github/workflows/**')" ]; then
                  echo "Live application source is byte-identical; only GitHub workflow files differ."; exit 0
                else
                  echo "Application changes still awaiting Vercel deployment."
                fi
              fi
            fi
            sleep 10
          done
          echo "::error::Personal portal did not deploy the exact reviewed commit with schema 0082 and encryption key."
          exit 1

      - name: Verify demo employee cabinet actually renders
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -L -o /tmp/pilot-employee-demo.html -w '%{http_code}' https://operis-workspace.vercel.app/employee-timesheet/demo)"
          test "$code" = "200" || { echo "::error::Employee demo returned HTTP $code"; exit 1; }
          grep -Eq 'OPERIS|Личный кабинет' /tmp/pilot-employee-demo.html || {
            echo "::error::Employee demo page does not contain the expected application markup."; exit 1;
          }

      - name: Verify unauthenticated employee portal API reaches the app
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 15 -sS -o /tmp/invalid-employee-token.json -w '%{http_code}' https://operis-workspace.vercel.app/api/public/worker-timesheet/invalid-public-test-token)"
          test "$code" = "404" || { echo "::error::Employee public API returned HTTP $code instead of app-level invalid token 404"; exit 1; }
          node - <<'NODE'
          const payload=require('/tmp/invalid-employee-token.json');
          if(!/Ссылка недействительна/.test(payload.error||''))throw Error('Unexpected response: public employee portal may be blocked by authentication or protection');
          console.log('Unauthenticated public API reached OPERIS and rejected an unknown employee token correctly.');
          NODE
