name: Personal Employee Link Diagnostic
on:
  push:
    branches: [pilot/sergey-work]
    paths:
      - "app/api/system/status/route.ts"
      - ".github/workflows/pilot-employee-link-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-personal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live personal runtime readiness without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl --max-time 12 -sS -o /tmp/pilot-status.json -w '%{http_code}' "https://operis-workspace.vercel.app/api/system/status" || true)"
            if [ "$code" = "200" ]; then
              if node - <<'NODE'
          const status=require('/tmp/pilot-status.json');
          console.log(JSON.stringify({deployedSha:status.deploymentSha,schemaVersion:status.schemaVersion,dbAvailable:status.databaseConfigured,cryptoAvailable:status.employeeLinkEncryptionConfigured}));
          if(status.ok!==true||status.schemaVersion!=='0079_employee_portal_link_control.sql')process.exit(1);
          if(!status.deploymentSha)process.exit(1);
          if(status.employeeLinkEncryptionConfigured!==true)process.exit(2);
          NODE
              then exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Personal portal live runtime did not reach a usable deployment with an encryption key."
          exit 1

      - name: Verify unauthenticated employee portal API reaches the app
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 15 -sS -o /tmp/invalid-employee-token.json -w '%{http_code}' https://operis-workspace.vercel.app/api/public/worker-timesheet/invalid-public-test-token)"
          test "$code" = "404" || { echo "::error::Employee public API returned HTTP $code instead of app-level invalid token 404"; exit 1; }
          node - <<'NODE'
          const payload=require('/tmp/invalid-employee-token.json');
          if(!/Ссылка недействительна/.test(payload.error||''))throw Error('Unexpected response: public employee portal may be blocked by authentication or protection');
          console.log('Unauthenticated public API reached OPERIS and rejected an unknown employee token correctly.');
          NODE
