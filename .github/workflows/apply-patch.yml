name: Apply staged patch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.issue.title, 'patch: apply typed lint fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply staged files
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/patch.* > /tmp/lint-fixes.b64
          base64 -d /tmp/lint-fixes.b64 > /tmp/lint-fixes.tar.gz
          tar -xzf /tmp/lint-fixes.tar.gz -C .
          rm -rf .patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: type service DTOs and lint boundaries"
          git push origin HEAD:main
