name: Activation Diagnostics

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check activation page
        shell: bash
        run: |
          set -euo pipefail
          url='https://outsourcing-operations-os-g942.vercel.app/activate?token=test'
          code="$(curl -sS -L -D /tmp/headers -o /tmp/body -w '%{http_code}' "$url" || true)"
          echo "status=$code"
          echo '--- headers ---'
          cat /tmp/headers
          echo '--- body ---'
          head -c 6000 /tmp/body || true
          echo
