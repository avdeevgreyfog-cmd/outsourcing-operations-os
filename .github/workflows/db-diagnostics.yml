name: Temporary DB Diagnostics

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read production database identifiers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl -sS "https://outsourcing-operations-os-g942.vercel.app/api/system/status?diagnostic=0CIhX4AK4nwx46dalGrHBIfYaywU1bU5")"
            deployed_sha="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).deploymentSha||"")}catch{}})')"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for diagnostic deployment"
          exit 1
