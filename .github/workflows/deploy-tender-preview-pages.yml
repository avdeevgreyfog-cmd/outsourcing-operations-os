name: Deploy OPERIS GitHub Alias

on:
  push:
    branches: [main]
    paths:
      - 'preview/github-pages-alias.html'
      - 'preview/recruiting-v2/**'
      - '.github/workflows/deploy-tender-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble GitHub Pages production alias
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site
          cp preview/github-pages-alias.html .pages-site/index.html
          cp preview/github-pages-alias.html .pages-site/404.html
          mkdir -p .pages-site/recruiting-preview
          cp -R preview/recruiting-v2/. .pages-site/recruiting-preview/
          touch .pages-site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
