name: Deploy OPERIS GitHub Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_DEMO: "1"
      NEXT_PUBLIC_GITHUB_PAGES_DEMO: "1"
      NEXT_PUBLIC_BASE_PATH: "/outsourcing-operations-os"
      DEMO_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare static demo source
        run: |
          node scripts/prepare-pages-demo.mjs
          rm -rf app/api
          rm -rf app/login app/activate
          rm -rf app/request-form app/request-intake

      - name: Build the real OPERIS app for GitHub Pages
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
