name: Bootstrap repository

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore repository tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.* > /tmp/tree.b64
          base64 -d /tmp/tree.b64 > /tmp/tree.tar.gz
          tar -xzf /tmp/tree.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build first Outsourcing Operations OS backbone"
          git push origin HEAD:main
