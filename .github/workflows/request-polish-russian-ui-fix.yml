name: Request interface Russian cleanup

on:
  push:
    branches:
      - feat/request-visual-polish-ru

permissions:
  contents: write

jobs:
  correct-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/request-visual-polish-ru
          fetch-depth: 0
      - name: Remove remaining user-facing technical labels
        run: |
          python - <<'PY'
          from pathlib import Path

          blank = Path('components/PublicBlankRequestForm.tsx')
          text = blank.read_text()
          text = text.replace(
              'const providers=[["client","Предоставляет заказчик"],["us","Нужно включить в предложение исполнителя"],["worker","Обеспечивает сотрудник"],["discretion","На усмотрение исполнителя"],["not_required","Не требуется"],["unknown","Нужно уточнить"]] as const;',
              'const providers=[["client","Предоставляет заказчик"],["us","Обеспечиваем мы"],["not_required","Не требуется"],["unknown","Нужно уточнить"]] as const;'
          )
          text = text.replace('<label>Email<input', '<label>Эл. почта<input')
          blank.write_text(text)

          public = Path('components/PublicRequestForm.tsx')
          text = public.read_text()
          text = text.replace(
              'const providerOptions = [["client","Заказчик"],["us","Исполнитель"],["worker","Работник"],["not_required","Не требуется"],["unknown","Нужно уточнить"]] as const;',
              'const providerOptions = [["client","Заказчик"],["us","Исполнитель"],["not_required","Не требуется"],["unknown","Нужно уточнить"]] as const;'
          )
          text = text.replace('consumables: "Расходные материалы"', 'consumables: "Расходняк"')
          text = text.replace('<span>Email</span>', '<span>Эл. почта</span>')
          public.write_text(text)

          detail = Path('app/(workspace)/requests/[id]/page.tsx')
          text = detail.read_text()
          marker = 'function fmtDate(value: string) {'
          helper = '''function timelineText(value: string) {\n  const replacements: Record<string, string> = {\n    new: "Новая", clarification: "Уточнение условий", ready_calc: "Готова к расчёту", calculation: "Расчёт", proposal_prep: "Подготовка КП", proposal_client: "КП у заказчика", negotiation: "Переговоры / доработка", agreed: "Согласовано", not_agreed: "Не согласовано", draft: "Черновик", pending: "На согласовании", accepted: "Принято", rejected: "Отклонено", sent: "Отправлено", approved: "Согласовано"\n  };\n  let result = value;\n  for (const [code, label] of Object.entries(replacements)) result = result.replaceAll(code, label);\n  return result.replace(/\\bv(\\d+)\\b/g, "№$1");\n}\n\n'''
          if 'function timelineText(value: string)' not in text:
              if marker not in text:
                  raise SystemExit('Could not find timeline helper insertion point')
              text = text.replace(marker, helper + marker)
          text = text.replace('<strong>{item.title}</strong><span>{fmtDate(item.at)}</span>', '<strong>{timelineText(item.title)}</strong><span>{fmtDate(item.at)}</span>')
          text = text.replace('<p>{item.detail}</p>', '<p>{timelineText(item.detail)}</p>')
          detail.write_text(text)

          workflow = Path('.github/workflows/request-polish-russian-ui-fix.yml')
          workflow.unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/PublicBlankRequestForm.tsx components/PublicRequestForm.tsx 'app/(workspace)/requests/[id]/page.tsx' .github/workflows/request-polish-russian-ui-fix.yml
          git commit -m "fix: finish request interface russianization"
          git push origin HEAD:feat/request-visual-polish-ru
