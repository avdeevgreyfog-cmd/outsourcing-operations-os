name: Staging Database

on:
  push:
    branches: [beta]
    paths:
      - "migrations/**"
      - "scripts/migrate.mjs"
      - ".github/workflows/staging-database.yml"
  workflow_dispatch:

jobs:
  migrate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require staging database secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::STAGING_DATABASE_URL environment secret is required."; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply staging migrations
        run: npm run db:migrate
