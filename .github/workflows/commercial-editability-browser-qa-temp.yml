name: Commercial Editability Browser QA
on:
  pull_request:
    branches: [beta]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      SESSION_SECRET: "ci-browser-commercial-editability"
      BASE_URL: "http://127.0.0.1:3100"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run editability browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3100 >/tmp/operis-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            code="$(curl -sS -o /tmp/status.json -w '%{http_code}' http://127.0.0.1:3100/api/system/status || true)"
            if [ "$code" = "200" ]; then break; fi
            if [ "$attempt" = "50" ]; then cat /tmp/operis-browser-server.log; exit 1; fi
            sleep 1
          done
          node tests/commercial-editability-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-editability-browser-qa
          path: artifacts/commercial-editability
          retention-days: 1
