name: Tender Alignment QA Temporary

on:
  push:

jobs:
  verify-tender-alignment:
    if: github.ref == 'refs/heads/fix/tender-create-board-alignment-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEMO_MODE: "true"
      SESSION_SECRET: "tender-alignment-qa-only"
      TENDERS_QA_OUTPUT: "artifacts/tenders-alignment-qa"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tender browser QA
        run: |
          npm start > /tmp/operis-tender-alignment.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/tenders >/dev/null; then break; fi
            if [ "$attempt" = "60" ]; then cat /tmp/operis-tender-alignment.log; exit 1; fi
            sleep 1
          done
          node tests/tenders-browser.mjs
      - name: Upload tender QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-alignment-browser-qa
          path: artifacts/tenders-alignment-qa
          retention-days: 2
