name: Staging Smoke

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    env:
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: deployment-expectation
        name: Determine whether this commit requires a new staging deployment
        shell: bash
        run: |
          set -euo pipefail
          require_deployment=false
          changed_files="$(git diff --name-only HEAD^ HEAD || true)"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .github/*|tests/*|docs/*|migrations/*|scripts/migrate.mjs|scripts/migration-safety.mjs|*.md)
                ;;
              *)
                require_deployment=true
                ;;
            esac
          done <<< "$changed_files"
          echo "require_deployment=$require_deployment" >> "$GITHUB_OUTPUT"
          echo "require_deployment=$require_deployment"
          printf '%s\n' "$changed_files"

      - name: Check staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::STAGING_BASE_URL repository variable is required."; exit 1; }
          test -n "$PRODUCTION_BASE_URL" || { echo "::error::PRODUCTION_BASE_URL repository variable is required."; exit 1; }
          test -n "$AUTOMATION_BYPASS_SECRET" || { echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET staging secret is required."; exit 1; }

      - name: Wait for staging deployment
        env:
          REQUIRE_DEPLOYMENT: ${{ steps.deployment-expectation.outputs.require_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code="$(curl -sS -H "x-vercel-protection-bypass: $AUTOMATION_BYPASS_SECRET" -o /tmp/status.json -w '%{http_code}' "$BASE_URL/api/system/status" || true)"
            deployed_sha="$(node -e "try{const s=require('/tmp/status.json');process.stdout.write(s.deploymentSha||'')}catch{}" 2>/dev/null || true)"
            healthy=false
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/status.json; then healthy=true; fi
            if [ "$healthy" = "true" ] && { [ "$REQUIRE_DEPLOYMENT" != "true" ] || [ "$deployed_sha" = "$GITHUB_SHA" ]; }; then
              cat /tmp/status.json
              exit 0
            fi
            echo "attempt=$attempt status=$code deployed_sha=$deployed_sha expected_sha=$GITHUB_SHA require_deployment=$REQUIRE_DEPLOYMENT"
            sleep 10
          done
          if [ "$REQUIRE_DEPLOYMENT" = "true" ]; then
            echo "Beta application commit did not become active in staging in time."
          else
            echo "Staging runtime did not become healthy in time."
          fi
          cat /tmp/status.json 2>/dev/null || true
          exit 1

      - name: Verify staging database boundary
        shell: bash
        run: |
          set -euo pipefail
          staging_expected_schema="$(find migrations -maxdepth 1 -type f -name '[0-8][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -n 1)"
          git fetch --no-tags --depth=1 origin main
          production_expected_schema="$(git ls-tree -r --name-only FETCH_HEAD migrations | grep -E '^migrations/[0-8][0-9]{3}_.+\.sql$' | sed 's#^migrations/##' | sort | tail -n 1)"

          test -n "$staging_expected_schema" || { echo "::error::Unable to resolve beta schema baseline."; exit 1; }
          test -n "$production_expected_schema" || { echo "::error::Unable to resolve main schema baseline."; exit 1; }

          schema_ready=false
          for attempt in $(seq 1 36); do
            staging_code="$(curl -sS -H "x-vercel-protection-bypass: $AUTOMATION_BYPASS_SECRET" -o /tmp/status.json -w '%{http_code}' "$BASE_URL/api/system/status" || true)"
            staging_schema="$(node -e "try{const s=require('/tmp/status.json');process.stdout.write(s.schemaVersion||'')}catch{}" 2>/dev/null || true)"
            if [ "$staging_code" = "200" ] && [ "$staging_schema" = "$staging_expected_schema" ]; then
              schema_ready=true
              break
            fi
            echo "schema_attempt=$attempt active=$staging_schema expected=$staging_expected_schema"
            sleep 10
          done
          if [ "$schema_ready" != "true" ]; then
            echo "::error::Staging schema did not reach the beta baseline in time."
            cat /tmp/status.json 2>/dev/null || true
            exit 1
          fi

          production_code="$(curl -sS -o /tmp/production-status.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/system/status")"
          test "$production_code" = "200"

          STAGING_EXPECTED_SCHEMA="$staging_expected_schema" PRODUCTION_EXPECTED_SCHEMA="$production_expected_schema" node - <<'NODE'
          const fs=require("node:fs");
          const staging=JSON.parse(fs.readFileSync("/tmp/status.json","utf8"));
          const production=JSON.parse(fs.readFileSync("/tmp/production-status.json","utf8"));
          if(staging.ok!==true)throw new Error("staging runtime is unhealthy");
          if(staging.databaseConfigured!==true)throw new Error("staging DATABASE_URL is not configured");
          if(!staging.databaseIdentity)throw new Error("staging database identity is unavailable");
          if(staging.schemaVersion!==process.env.STAGING_EXPECTED_SCHEMA){
            throw new Error(`staging schema is not current for beta; expected=${process.env.STAGING_EXPECTED_SCHEMA} active=${staging.schemaVersion??"unknown"}`);
          }
          if(staging.environment!=="staging"){
            throw new Error(`staging deployment must report APP_ENVIRONMENT=staging; got ${staging.environment??"unknown"}`);
          }

          if(production.ok!==true)throw new Error("production runtime is unhealthy");
          if(production.databaseConfigured!==true)throw new Error("production DATABASE_URL is not configured");
          if(production.environment!=="production"){
            throw new Error(`production deployment must report APP_ENVIRONMENT=production; got ${production.environment??"unknown"}`);
          }
          if(!production.databaseIdentity){
            throw new Error("production database identity is unavailable; the production status endpoint must include databaseIdentity");
          }
          if(staging.databaseIdentity===production.databaseIdentity){
            throw new Error("staging and production resolve to the same PostgreSQL database");
          }
          console.log("Runtime boundary verified: staging and production PostgreSQL identities are distinct.");
          if(production.schemaVersion!==process.env.PRODUCTION_EXPECTED_SCHEMA){
            throw new Error(`production schema drifted from main; expected=${process.env.PRODUCTION_EXPECTED_SCHEMA} active=${production.schemaVersion??"unknown"}`);
          }
          NODE

      - name: Verify public entry surfaces
        shell: bash
        run: |
          set -euo pipefail
          login_code="$(curl -sS -L -H "x-vercel-protection-bypass: $AUTOMATION_BYPASS_SECRET" -o /tmp/login.html -w '%{http_code}' "$BASE_URL/login")"
          test "$login_code" = "200"
          demo_code="$(curl -sS -L -H "x-vercel-protection-bypass: $AUTOMATION_BYPASS_SECRET" -H 'Cookie: oo_workspace_mode=demo; oo_demo_role=director' -o /tmp/demo.html -w '%{http_code}' "$BASE_URL/")"
          test "$demo_code" = "200"

      - name: Verify internal request workspace
        shell: bash
        run: |
          set -euo pipefail
          director_code="$(curl -sS -L -H "x-vercel-protection-bypass: $AUTOMATION_BYPASS_SECRET" -H 'Cookie: oo_workspace_mode=demo; oo_demo_role=director' -o /tmp/procurement-director.html -w '%{http_code}' "$BASE_URL/procurement")"
          test "$director_code" = "200"
          grep -q 'Внутренние заявки' /tmp/procurement-director.html
          grep -q 'Пополнение рекламного кабинета Avito' /tmp/procurement-director.html
          grep -q 'Рабочая обувь для новых сотрудников' /tmp/procurement-director.html

          recruiter_code="$(curl -sS -L -H "x-vercel-protection-bypass: $AUTOMATION_BYPASS_SECRET" -H 'Cookie: oo_workspace_mode=demo; oo_demo_role=recruiter_staff' -o /tmp/procurement-recruiter.html -w '%{http_code}' "$BASE_URL/procurement")"
          test "$recruiter_code" = "200"
          grep -q 'Внутренние заявки' /tmp/procurement-recruiter.html
          grep -q 'Пополнение рекламного кабинета Avito' /tmp/procurement-recruiter.html
          if grep -q 'Рабочая обувь для новых сотрудников' /tmp/procurement-recruiter.html; then
            echo "::error::Recruiter can see an internal request created by another role."
            exit 1
          fi
